apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.clusterName }}
  labels:
    application: patroni
    cluster-name: {{ .Values.clusterName }}
spec:
  replicas: {{ .Values.replicaCount }}
  serviceName: {{ .Values.clusterName }}
  selector:
    matchLabels:
      application: patroni
      cluster-name: {{ .Values.clusterName }}
  template:
    metadata:
      labels:
        application: patroni
        cluster-name: {{ .Values.clusterName }}
    spec:
      serviceAccountName: {{ .Values.clusterName }}
      terminationGracePeriodSeconds: 0
      containers:
      - name: {{ .Values.clusterName }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        readinessProbe:
          httpGet:
            scheme: HTTP
            path: /readiness
            port: {{ .Values.ports.api }}
          initialDelaySeconds: 3
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        ports:
        - containerPort: {{ .Values.ports.api }}
          protocol: TCP
        - containerPort: {{ .Values.ports.postgresql }}
          protocol: TCP
        volumeMounts:
        - mountPath: /home/postgres/pgdata
          name: pgdata
        env:
        - name: PATRONI_KUBERNETES_POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: PATRONI_KUBERNETES_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: PATRONI_KUBERNETES_USE_ENDPOINTS
          value: 'true'
        - name: PATRONI_KUBERNETES_LABELS
          value: '{application: patroni, cluster-name: {{ .Values.clusterName }}}'
        - name: PATRONI_SUPERUSER_USERNAME
          value: postgres
        - name: PATRONI_SUPERUSER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.clusterName }}
              key: superuser-password
        - name: PATRONI_REPLICATION_USERNAME
          value: standby
        - name: PATRONI_REPLICATION_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.clusterName }}
              key: replication-password
        - name: PATRONI_SCOPE
          value: {{ .Values.clusterName }}
        - name: PATRONI_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: PATRONI_POSTGRESQL_DATA_DIR
          value: /home/postgres/pgdata/pgroot/data
        - name: PATRONI_POSTGRESQL_PGPASS
          value: /tmp/pgpass
        - name: PATRONI_POSTGRESQL_LISTEN
          value: '0.0.0.0:{{ .Values.ports.postgresql }}'
        - name: PATRONI_RESTAPI_LISTEN
          value: '0.0.0.0:{{ .Values.ports.api }}'
      volumes:
      {{- if not .Values.persistence.enabled }}
      - name: pgdata
        emptyDir: {}
      {{- end }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
  - metadata:
      labels:
        application: patroni
        cluster-name: {{ .Values.clusterName }}
      name: pgdata
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: {{ .Values.persistence.size }}
  {{- end }}
